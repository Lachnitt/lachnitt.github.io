# Keeps _publications/*.md in sync with _bibliography/papers.bib, so that
# adding a paper to the website is just a matter of pasting a BibTeX entry.
name: Publication list

on:
  push:
    branches: [main]
    paths:
      - "_bibliography/**"
      - "markdown_generator/bib2md.py"
      - ".github/workflows/publications.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate publication pages
        run: python3 markdown_generator/bib2md.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- _publications; then
            echo "Publication pages are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _publications
          git commit -m "Regenerate publication pages from papers.bib"
          git push
